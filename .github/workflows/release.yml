name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate and build renderer + main
        run: |
          npm run check
          npm test
          npm run build

      - name: Package installers
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hisvex-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

      - name: Upload installers to draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          generate_release_notes: true

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Verify installers and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" --json assets > release-assets.json
          python3 - <<'PY'
          import json, os
          version = os.environ["RELEASE_TAG"].removeprefix("v")
          required = {
              f"Hisvex-Setup-{version}.exe",
              f"Hisvex-Portable-{version}.exe",
              f"Hisvex-{version}-x64.dmg",
              f"Hisvex-{version}-arm64.dmg",
              f"Hisvex-{version}.AppImage",
              f"hisvex-desktop_{version}_amd64.deb",
          }
          with open("release-assets.json") as source:
              assets = json.load(source)["assets"]
          uploaded = {item["name"] for item in assets if item["size"] > 0}
          missing = required - uploaded
          if missing:
              raise SystemExit("Missing release installers: " + ", ".join(sorted(missing)))
          print(f"Verified all {len(required)} installers for {version}")
          PY
          gh release edit "$RELEASE_TAG" --draft=false --latest
