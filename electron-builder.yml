appId: com.hisvex.desktop
productName: Hisvex
copyright: Copyright © 2026 Hisvex

directories:
  output: dist
  buildResources: build

files:
  - build/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Hisvex
  artifactName: "${productName}-Setup-${version}.${ext}"

portable:
  artifactName: "${productName}-Portable-${version}.exe"

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.png
  category: public.app-category.business
  hardenedRuntime: true
  artifactName: "${productName}-${version}-${arch}.${ext}"

dmg:
  # ${arch} is required in the volume title — building x64 and arm64 DMGs in
  # the same run mounts two volumes; without ${arch} both get the identical
  # name "Hisvex ${version}", so the second `hdiutil detach` targets an
  # ambiguous/already-detached volume and fails ("Above command failed,
  # retrying 5 more times" -> exit 1), which is what's been failing this
  # repo's mac CI job since v1.0.3.
  title: "${productName} ${version} ${arch}"
  icon: build/icon.png
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

extraMetadata:
  main: build/main.js
