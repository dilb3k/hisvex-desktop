appId: com.hisvex.desktop
productName: Hisvex
copyright: Copyright © 2026 Hisvex

directories:
  output: dist
  buildResources: build

files:
  - build/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Hisvex
  artifactName: "${productName}-Setup-${version}.${ext}"

portable:
  artifactName: "${productName}-Portable-${version}.exe"

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.png
  category: public.app-category.business
  hardenedRuntime: true
  artifactName: "${productName}-${version}-${arch}.${ext}"

dmg:
  title: "${productName} ${version}"
  icon: build/icon.png
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

extraMetadata:
  main: build/main.js
